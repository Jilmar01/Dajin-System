<section class="user-form-page" aria-labelledby="user-form-title">
  <header class="form-header">
    <div>
      <h1 id="user-form-title">Create User</h1>
      <p>Enter the account details and assign a role.</p>
    </div>
  </header>

  @if (formError()) {
    <div class="form-error" role="alert">{{ formError() }}</div>
  }

  <form class="user-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-grid">
      <label class="form-field">
        <span>Username <span class="required-mark" aria-hidden="true">*</span></span>
        <input type="text" formControlName="username" autocomplete="username" required />
        @if (form.controls.username.touched && form.controls.username.hasError('required')) {
          <span class="field-error">Username is required.</span>
        }
      </label>

      <label class="form-field">
        <span>Password <span class="required-mark" aria-hidden="true">*</span></span>
        <input type="password" formControlName="password" autocomplete="new-password" required />
        @if (form.controls.password.touched && form.controls.password.hasError('required')) {
          <span class="field-error">Password is required.</span>
        }
      </label>

      <label class="form-field">
        <span>Role <span class="required-mark" aria-hidden="true">*</span></span>
        <select formControlName="rol" required>
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </label>
    </div>

    <footer class="form-actions">
      <button class="button button-secondary" type="button" [disabled]="isSubmitting()" (click)="cancelled.emit()">Cancel</button>
      <button class="button button-primary" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating...' : 'Create User' }}
      </button>
    </footer>
  </form>
</section>

<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Dajin System home">
    <span class="brand-icon">DJN</span>
    <span class="brand-text">Dajin System</span>
  </a>

  <nav class="nav-menu" aria-label="Main navigation">
    @for (item of visibleNavigation(); track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        routerLinkActive="active"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="topbar-actions">
    <button class="notif-btn" type="button" aria-label="Notifications">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="badge">3</span>
    </button>

    <div class="user-menu">
      <button
        class="user-profile"
        type="button"
        aria-haspopup="true"
        [attr.aria-expanded]="menuOpen"
        (click)="toggleMenu()"
      >
        <span class="avatar" [style.background-color]="avatarColor">{{ userInitial }}</span>
        <span class="user-name">{{ userName }}</span>
        <svg class="chevron-icon" [class.open]="menuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      @if (menuOpen) {
        <section class="dropdown-menu" aria-label="User account">
          <button class="logout-button" type="button" (click)="logout()">Logout</button>
        </section>
      }
    </div>
  </div>
</header>
